# Render Blueprint — backend API + PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
#
# The Vite frontend is NOT here — it deploys to Vercel from the repo root.
#
# Chatr is refreshed on every redeploy (see the web service's startCommand).
# To keep it fresh between deploys, add a Render Cron Job running
# `python -m metromobile refresh chatr` (rootDir: backend) once a paid
# workspace is available — Render cron jobs have no free plan.
#
# After Render provisions this, set these two "sync: false" env vars on the
# metromobile-api service in the dashboard:
#   METROMOBILE_HTTP_USER_AGENT  — a descriptive UA + contact, e.g.
#       "metro-mobile-plans/1.0 (+https://<your-site>; contact: you@example.com)"
#   METROMOBILE_FRONTEND_ORIGIN  — your Vercel URL(s), comma-separated,
#       e.g. "https://metro-mobile-plans.vercel.app"

databases:
  - name: metromobile-db
    databaseName: metromobile
    user: metromobile
    plan: free            # NOTE: Render free PostgreSQL is deleted after 30 days.
    region: oregon        #       Upgrade to a paid plan to keep the site up.

services:
  - type: web
    name: metromobile-api
    runtime: python
    plan: free            # NOTE: free web services sleep after 15 min idle (cold starts).
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    # migrate -> bootstrap the approved V1 dataset (idempotent, deterministic:
    # Chatr from the reviewed snapshot) -> best-effort live Chatr refresh so a
    # redeploy always freshens it even without the cron -> serve.
    startCommand: >-
      python -m alembic upgrade head &&
      python -m metromobile bootstrap &&
      (python -m metromobile refresh chatr || true) &&
      python -m uvicorn metromobile.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: metromobile-db
          property: connectionString
      - key: METROMOBILE_FRONTEND_ORIGIN
        sync: false
      - key: METROMOBILE_HTTP_USER_AGENT
        sync: false
      # production runs a periodic (not continuous) manual re-verification
      # cadence, so widen the official_manual freshness windows.
      - key: METROMOBILE_MANUAL_FRESH_HOURS
        value: "2160"     # 90 days
      - key: METROMOBILE_MANUAL_REVERIFY_HOURS
        value: "4320"     # 180 days
