# Render Blueprint — backend API + PostgreSQL + the Chatr refresh cron.
# Docs: https://render.com/docs/blueprint-spec
#
# The Vite frontend is NOT here — it deploys to Vercel from the repo root.
#
# After Render provisions this, set these two "sync: false" env vars in the
# dashboard for BOTH the web service and the cron job:
#   METROMOBILE_HTTP_USER_AGENT  — a descriptive UA + contact, e.g.
#       "metro-mobile-plans/1.0 (+https://<your-site>; contact: you@example.com)"
#   METROMOBILE_FRONTEND_ORIGIN  — (web service only) your Vercel URL(s),
#       comma-separated, e.g. "https://metro-mobile-plans.vercel.app"

databases:
  - name: metromobile-db
    databaseName: metromobile
    user: metromobile
    plan: free            # NOTE: Render free PostgreSQL is deleted after 30 days.
    region: oregon        #       Upgrade to a paid plan to keep the site up.

services:
  - type: web
    name: metromobile-api
    runtime: python
    plan: free            # NOTE: free web services sleep after 15 min idle (cold starts).
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    # migrate -> bootstrap the approved V1 dataset (idempotent, deterministic:
    # Chatr from the reviewed snapshot) -> best-effort live Chatr refresh so a
    # redeploy always freshens it even without the cron -> serve.
    startCommand: >-
      python -m alembic upgrade head &&
      python -m metromobile bootstrap &&
      (python -m metromobile refresh chatr || true) &&
      python -m uvicorn metromobile.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: metromobile-db
          property: connectionString
      - key: METROMOBILE_FRONTEND_ORIGIN
        sync: false
      - key: METROMOBILE_HTTP_USER_AGENT
        sync: false
      # production runs a periodic (not continuous) manual re-verification
      # cadence, so widen the official_manual freshness windows.
      - key: METROMOBILE_MANUAL_FRESH_HOURS
        value: "2160"     # 90 days
      - key: METROMOBILE_MANUAL_REVERIFY_HOURS
        value: "4320"     # 180 days

  # Keeps Chatr (the one automated provider) current between redeploys.
  # Render cron jobs need a paid workspace; if you skip this, Chatr still
  # refreshes on every redeploy (see the web service's startCommand) and only
  # goes "stale" 24h after the last deploy with no refresh.
  - type: cron
    name: metromobile-chatr-refresh
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    schedule: "23 */4 * * *"   # every 4 hours (well inside the 6h fresh window)
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: python -m metromobile refresh chatr
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: metromobile-db
          property: connectionString
      - key: METROMOBILE_HTTP_USER_AGENT
        sync: false
