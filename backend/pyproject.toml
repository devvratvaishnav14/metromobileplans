[project]
name = "metromobile-backend"
version = "0.2.0"
description = "Data pipeline + API for the metro-mobile-plans analysis interface"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "beautifulsoup4>=4.12",
    # PostgreSQL driver for production (SQLite needs no driver for local dev).
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
metromobile = "metromobile.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["metromobile", "metromobile.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
